name: Publish branch
run-name: Deploy ${{ github.ref_name }} to dev by @${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Trigger CodePipeline
        id: trigger
        run: |
          PIPELINE_NAME="dev-doc-scan-worker-app-prepare-docker-image"
          
          echo "Triggering CodePipeline: ${PIPELINE_NAME}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          
          # Start pipeline execution
          EXECUTION_ID=$(aws codepipeline start-pipeline-execution \
            --name ${PIPELINE_NAME} \
            --query 'pipelineExecutionId' \
            --output text)
          
          echo "Pipeline triggered successfully!"
          echo "Execution ID: ${EXECUTION_ID}"
          echo ""
          echo "execution_id=${EXECUTION_ID}" >> $GITHUB_OUTPUT
          echo "pipeline_name=${PIPELINE_NAME}" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        run: |
          echo "## CodePipeline Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline:** \`${{ steps.trigger.outputs.pipeline_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Execution ID:** \`${{ steps.trigger.outputs.execution_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Monitor Progress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View in AWS Console:" >> $GITHUB_STEP_SUMMARY
          echo "https://eu-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines/${{ steps.trigger.outputs.pipeline_name }}/view?region=eu-west-2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "1. **Source** - Clone Git repository + Get appspec from S3" >> $GITHUB_STEP_SUMMARY
          echo "2. **DockerImageDeployment** - Build Docker image with CodeBuild" >> $GITHUB_STEP_SUMMARY
          echo "3. **Deploy** - ECS Blue/Green deployment" >> $GITHUB_STEP_SUMMARY
