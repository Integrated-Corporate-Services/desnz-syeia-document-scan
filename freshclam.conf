# Freshclam configuration for local development
DatabaseDirectory /var/lib/clamav
UpdateLogFile /var/log/clamav/freshclam.log
LogVerbose yes
LogSyslog no
LogFacility LOG_LOCAL6
LogFileMaxSize 2M
LogRotate yes
LogTime yes
Foreground no
Debug no
MaxAttempts 5
DatabaseOwner clamav
AllowSupplementaryGroups yes

# Use HTTP instead of HTTPS to avoid SSL certificate issues in dev
DatabaseMirror http://database.clamav.net
DatabaseMirror http://db.local.clamav.net

# Timeouts
ConnectTimeout 30
ReceiveTimeout 60

# Bytecode
Bytecode yes
NotifyClamd /etc/clamav/clamd.conf

# Safety
SafeBrowsing no
