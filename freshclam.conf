# Freshclam configuration — desnz-syeia-document-scan
# Used by entrypoint.sh to download ClamAV virus definitions on first run.
# Definitions are persisted in the clamav-data Docker volume so subsequent
# container restarts do not re-download (~250MB).

DatabaseDirectory /var/lib/clamav
UpdateLogFile /var/log/clamav/freshclam.log
LogVerbose no
LogSyslog no
LogTime yes
LogRotate yes
LogFileMaxSize 2M
Foreground no
Debug no
MaxAttempts 5
DatabaseOwner clamav
AllowSupplementaryGroups yes


DatabaseMirror https://database.clamav.net

ConnectTimeout 60
ReceiveTimeout 120

Bytecode yes

NotifyClamd /etc/clamav/clamd.conf

SafeBrowsing no